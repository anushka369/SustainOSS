version: '3.8'

services:
  # PostgreSQL Database (Document Store + TimescaleDB)
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: sustainoss-postgres
    environment:
      POSTGRES_DB: sustainoss
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./packages/backend/scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sustainoss-network

  # Redis (Job Queue)
  redis:
    image: redis:7-alpine
    container_name: sustainoss-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sustainoss-network

  # Backend API
  backend:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
    container_name: sustainoss-backend
    environment:
      NODE_ENV: production
      PORT: 3000
      API_KEY: ${API_KEY:-change-me-in-production}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-change-me-in-production}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: sustainoss
      DB_USER: postgres
      DB_PASSWORD: postgres
      TIMESERIES_DB_HOST: postgres
      TIMESERIES_DB_PORT: 5432
      TIMESERIES_DB_NAME: sustainoss
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      CORS_ORIGINS: http://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sustainoss-network
    restart: unless-stopped

  # Frontend Dashboard
  frontend:
    build:
      context: .
      dockerfile: packages/frontend/Dockerfile
    container_name: sustainoss-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - sustainoss-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  sustainoss-network:
    driver: bridge
